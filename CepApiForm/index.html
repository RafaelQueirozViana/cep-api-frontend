<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <h1>Consulta de Endereço</h1>
    <form>
        <div class="form-contain">


            <div class="field-box">
                <label for="cep-input">CEP</label>
                <input type="number" id="cep-input">
                <p id="cep-error" class="error">erro: </p>
            </div>

            <div class="field-box">
                <label for="rua-input">Rua / Logradouro</label>
                <input type="text" id="rua-input">
            </div>

            <div class="field-box">
                <label for="bairro-input">Bairro</label>
                <input type="text" id="bairro-input">
            </div>

            <div class="field-box">
                <label for="city-input">Cidade</label>
                <input type="text" id="city-input">
            </div>

            <div class="field-box">
                <label for="uf-input">UF</label>
                <input type="text" id="uf-input">
            </div>


            <button type="submit" id="submit-btn">Enviar</button>



        </div>

    </form>

    <script src="./script.js"></script>
</body>

</html>
